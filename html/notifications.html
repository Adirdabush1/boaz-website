<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuyForce · Notifications</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body class="bf-screen">
  <header class="bf-header bf-header--solid">
    <span class="bf-header__logo">Notifications</span>
  </header>

  <main>
    <section class="bf-notifications__list" aria-label="Alerts">
      <article class="bf-list-item" role="button" tabindex="0">
        <img class="bf-list-item__thumb" src="../figma-export/icons/notifications.svg" alt="" aria-hidden="true" />
        <div class="bf-list-item__meta">
          <strong>Flux Flex funded!</strong>
          <p>The group hit 100%. We will charge ₪189 in 1 hour.</p>
          <span class="bf-card__countdown">2m ago</span>
        </div>
        <span class="bf-status-badge bf-status-badge--active">New</span>
      </article>
      <article class="bf-list-item">
        <img class="bf-list-item__thumb" src="../figma-export/icons/groups.svg" alt="" aria-hidden="true" />
        <div class="bf-list-item__meta">
          <strong>Invite friends to close</strong>
          <p>Only 3 spots left for Pulse Mini Speaker group.</p>
          <span class="bf-card__countdown">1h ago</span>
        </div>
      </article>
    </section>
  </main>

  <nav class="bf-nav" role="navigation" aria-label="Primary">
    <button class="bf-nav__item" aria-label="Home">
      <img src="../figma-export/icons/home.svg" alt="" aria-hidden="true" />
      <div>Home</div>
    </button>
    <button class="bf-nav__item" aria-label="Categories">
      <img src="../figma-export/icons/categories.svg" alt="" aria-hidden="true" />
      <div>Categories</div>
    </button>
    <button class="bf-nav__item" aria-label="My groups">
      <img src="../figma-export/icons/groups.svg" alt="" aria-hidden="true" />
      <div>My Groups</div>
    </button>
    <button class="bf-nav__item bf-nav__item--active" aria-current="page" aria-label="Notifications">
      <img src="../figma-export/icons/notifications.svg" alt="" aria-hidden="true" />
      <div>Alerts <span class="bf-nav__badge">1</span></div>
    </button>
    <button class="bf-nav__item" aria-label="Profile">
      <img src="../figma-export/icons/profile.svg" alt="" aria-hidden="true" />
      <div>Profile</div>
    </button>
  </nav>
</body>
</html>
